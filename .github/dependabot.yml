version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements*.txt use ~= ranges; Dependabot raises the range when a new
    # minor version is released, and the suite decides whether it is safe.
    # It does not regenerate requirements.lock (the deployment) or
    # requirements-dev.lock (CI): after merging one of these, rerun both
    # pip-compile commands (README "Running it"), or nothing is updated.
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
