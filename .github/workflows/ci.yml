name: CI

on:
  push:
    # night-** covers an unattended run's integration branch and every task
    # branch under it (.claude/skills/night-run/SKILL.md §1.3). Without it those
    # pushes land unchecked: nobody is awake to read a failure, so CI is the
    # only thing that can catch one before morning.
    #
    # A finished task is pushed twice -- its own branch, then the run branch it
    # fast-forwards onto -- so the same tree is built twice. That is accepted
    # rather than optimised away: matching only the run branch would leave
    # provisional task branches unchecked, and those are deliberately never
    # merged (SKILL.md §4). Narrow this pattern if Actions minutes start to
    # matter.
    branches: [master, dev, 'night-**']
  pull_request:
    branches: [master, dev]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberately separate from, and not a dependency of, the test job: it needs
  # no database and installs nothing, so it can fail in seconds on its own.
  adr-guards:
    name: ADR guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # docs/adr/0003-backend.md (no DRF) names this as its enforcement. It also
      # fails when a record in docs/ has changed since docs/overview.html was.
      - name: Check ADR 0003 and the docs overview
        run: python scripts/adr_guards.py

  # pylint-django calls django.setup(), so this needs the runtime dependencies
  # and the two settings.py demands -- but no database: dj_database_url only
  # parses DATABASE_URL, it does not connect. Hence no service container here.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    env:
      # Never connected to. Present only so mysite/settings.py imports.
      DATABASE_URL: postgresql://lint:lint@localhost:5432/lint_only_never_connected
      DJANGO_SECRET_KEY: lint-only-not-a-real-key-00000000000000000000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      # requirements.txt as well, because the plugin imports Django itself.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Errors fail; warnings, refactors and conventions print without failing.
      # See scripts/dev.py lint() for why that is one pass and not two.
      - name: pylint
        run: python scripts/dev.py lint

  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Throwaway credential for a container that exists only for the life
          # of this job and is unreachable from outside it. Not a real secret;
          # nothing here may ever be reused for a deployed database.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: questionable_candy
        ports:
          - 5432:5432
        # The container being started is not the same as it accepting
        # connections -- without this, migrate can win the race and fail.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # settings.py raises ImproperlyConfigured without these two, and CI has no
      # .env to read them from -- that file is gitignored.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/questionable_candy
      DJANGO_SECRET_KEY: ci-only-not-a-real-key-0000000000000000000000
      # Matches local development, where this suite is known to pass. Django's
      # test runner forces DEBUG off during tests anyway; what this avoids is
      # the secure-cookie defaults that DEBUG=False would switch on, which the
      # plain-HTTP test client cannot satisfy.
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # DJANGO_SECURE_COOKIES is deliberately unset: tests/unit/test_settings.py
      # sets it per-test, and a value here would override those cases.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest-playwright is a pip package; the browser it drives is not, and
      # the runner image does not ship one. Until tests/e2e/ had tests in it the
      # browser fixture was never instantiated and this was invisible -- an
      # empty suite needs no browser. --with-deps pulls the shared libraries
      # chromium needs on the ubuntu image; chromium alone, because that is the
      # only browser the suite parametrises over.
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # scripts/dev.py runs makemigrations, which would quietly *write* a
      # missing migration and let the suite pass green. Fail here first: a model
      # change with no migration is drift, and CI is where it should surface.
      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run --noinput

      - name: Test suite
        run: python scripts/dev.py test
