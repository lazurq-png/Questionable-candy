# ruff: the formatter, and a lint pass that runs alongside pylint in
# `python scripts/dev.py lint` (pylint keeps its Django plugin and its own
# warnings; ruff adds import order, pyupgrade and bugbear checks).
line-length = 120  # .pylintrc's max-line-length
target-version = "py313"
# Generated by makemigrations; .pylintrc skips them too.
extend-exclude = ["**/migrations/**"]

[lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter owns code layout; what it cannot wrap (long strings, URLs,
# comments) is left to judgment rather than reflowed by hand.
ignore = ["E501"]

[format]
# The codebase mixes quote styles; normalising them is churn with no reader benefit.
quote-style = "preserve"
